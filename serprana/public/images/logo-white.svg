<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="90" stroke="white" stroke-width="1.5" fill="none" opacity="0.6"/>
  
  <!-- Snake/serpent spiral -->
  <path d="M100 40 C120 40 135 55 135 75 C135 95 120 105 100 105 C80 105 65 115 65 135 C65 155 80 165 100 165" 
        stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Snake head -->
  <ellipse cx="100" cy="38" rx="6" ry="8" fill="white" opacity="0.9"/>
  <!-- Eyes -->
  <circle cx="97" cy="35" r="1.5" fill="#3D7A8A"/>
  <circle cx="103" cy="35" r="1.5" fill="#3D7A8A"/>
  <!-- Tongue -->
  <path d="M98 43 L100 47 M100 47 L98 50 M100 47 L102 50" stroke="white" stroke-width="1" stroke-linecap="round"/>

  <!-- Leaf cluster top left -->
  <path d="M72 58 C60 48 48 52 50 65 C52 78 65 75 72 65 Z" fill="white" opacity="0.5"/>
  <path d="M72 65 L65 72" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Leaf cluster right -->
  <path d="M138 88 C150 80 158 88 152 100 C146 112 136 108 132 98 Z" fill="white" opacity="0.5"/>
  <path d="M132 98 L140 105" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Leaf cluster bottom -->
  <path d="M78 155 C68 145 60 150 64 163 C68 176 80 170 82 160 Z" fill="white" opacity="0.5"/>
  <path d="M82 160 L88 168" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

  <!-- Small dots/berries -->
  <circle cx="58" cy="90" r="3" fill="white" opacity="0.4"/>
  <circle cx="52" cy="98" r="2" fill="white" opacity="0.3"/>
  <circle cx="145" cy="120" r="3" fill="white" opacity="0.4"/>
  <circle cx="150" cy="130" r="2" fill="white" opacity="0.3"/>
  
  <!-- Inner decorative ring -->
  <circle cx="100" cy="100" r="70" stroke="white" stroke-width="0.5" fill="none" opacity="0.2" stroke-dasharray="4 6"/>
</svg>
